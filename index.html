<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#193e39" />
    <meta name="description" content="IHPAU HR Cloud — enterprise HR platform for the International Human Potential & Advancement Union." />
    <meta name="robots" content="noindex, nofollow" />
    <!--
      Content-Security-Policy: this is a client-only demo (no backend), so the
      policy below is deliberately restrictive. When this app is wired to a
      real API, add that origin to connect-src and serve this header from the
      server instead of (or in addition to) this meta tag.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>IHPAU HR Cloud</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
